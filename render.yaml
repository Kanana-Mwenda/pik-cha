services:
  - type: web
    name: pik-cha-backend
    region: oregon
    root: server            # work inside the server subdirectory
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install -e .           # install the package so "server" is importable
    startCommand: |
      # cwd is already set to /opt/render/project/src/server by the `root` flag
      gunicorn "server.app:app" --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pik-cha-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FLASK_ENV
        value: production
    autoDeploy: true

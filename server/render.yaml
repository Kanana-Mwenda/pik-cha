services:
  - type: web
    name: pik-cha-backend
    region: oregon
    runtime: python
    buildCommand: |
      pip install --upgrade pip && pip install -r server/requirements.txt
      # install the server package so it's importable
      pip install -e server
    startCommand: |
      # make sure the repo root is on the path and then launch gunicorn
      cd /opt/render/project/src
      gunicorn "server.app:app" --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pik-cha-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: /opt/render/project/src
    autoDeploy: true

